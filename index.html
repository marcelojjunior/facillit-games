<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Facillit Games mudou de endereço</title>
    <!-- Spec 008: the old address (GitHub Pages) sends people to the new app.
         The body below is the fallback when this script does not run. -->
    <script>
      location.replace('https://facillit-games.vercel.app/');
    </script>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
      }
      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px 16px;
        background: linear-gradient(180deg, #6fd3f2, #c8f5e4);
        color: #23264f;
        font-family:
          system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          sans-serif;
        text-align: center;
      }
      main {
        max-width: 420px;
        display: flex;
        flex-direction: column;
        gap: 16px;
        padding: 28px 20px;
        background: #ffffff;
        border-radius: 24px;
        box-shadow: 0 8px 0 #d9e1ec;
      }
      h1 {
        font-size: 1.75rem;
        line-height: 1.2;
      }
      p {
        font-size: 1.05rem;
        line-height: 1.45;
      }
      a {
        display: block;
        min-height: 48px;
        padding: 12px 20px;
        border-radius: 16px;
        background: #1f7fe0;
        box-shadow: 0 6px 0 #155ab0;
        color: #ffffff;
        font-size: 1.15rem;
        font-weight: 800;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>O Facillit Games mudou de endereço</h1>
      <p>O placar agora está em um site novo, com MECHE-MECHE e LEVA.</p>
